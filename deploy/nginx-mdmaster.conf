# WARNING: The rate-limit zones below belong in the http{} context: nginx refuses
# to start if they sit inside a server block. Put them in nginx.conf itself or
# in a snippet under /etc/nginx/conf.d/, for example:
#   limit_req_zone  $binary_remote_addr zone=mdmaster_run:10m  rate=10r/m;
#   limit_req_zone  $binary_remote_addr zone=mdmaster_page:10m rate=10r/s;
#   limit_conn_zone $binary_remote_addr zone=mdmaster_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name mdmaster.example.com;

    # WARNING: Behind another reverse proxy or load balancer every request arrives
    # from that proxy's address, so the per-client limits would count all visitors
    # as one client. Restore the visitor's address: un-comment the two lines below
    # and replace the placeholder with the proxy's address or range (one
    # set_real_ip_from line per range). Only trust the header from those
    # addresses: anyone can send it.
    #set_real_ip_from <proxy-address-or-range>;
    #real_ip_header   X-Forwarded-For;

    # WARNING: client_max_body_size stays at or above the app's own body ceiling:
    # the batch cap in MDMASTER_MAX_BATCH_BYTES plus 5 KiB per MDMASTER_MAX_FILES
    # file plus 96.3 KiB of form fields. Keep it under twice that ceiling too, so
    # the app can read a refused body and answer; a longer one ends in a 502.
    # With the app's default 100 MiB cap and nothing in front, use 110m.
    client_max_body_size 20m;

    # WARNING: Leave request buffering on (the default). Without it a slow uploader
    # would hold one of the app's run permits for as long as it liked.

    limit_conn        mdmaster_conn 10;
    limit_conn_status 429;
    limit_req_status  429;

    # KEEP: Un-comment the add_header line once this server answers on https.
    # HSTS is sent here, not by the app, because the proxy owns TLS. Browsers
    # ignore it on plain HTTP, but a host that may later serve plain HTTP should
    # not send it.
    #add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WARNING: A run may work for up to MDMASTER_RUN_TIMEOUT_SECONDS (default 60 s)
    # before it answers, so proxy_read_timeout clears it with margin to spare. Raise
    # the two together. A proxy in front of this one has its own read timeout,
    # which must clear the run timeout too.
    proxy_read_timeout  75s;
    proxy_send_timeout  60s;
    client_body_timeout 60s;

    proxy_connect_timeout 5s;

    location = /run {
        limit_req  zone=mdmaster_run burst=5 nodelay;
        proxy_pass http://127.0.0.1:8965;
    }

    location / {
        limit_req  zone=mdmaster_page burst=40 nodelay;
        proxy_pass http://127.0.0.1:8965;
    }
}
